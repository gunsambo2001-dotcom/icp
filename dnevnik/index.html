<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R-Дневник</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Шрифты не блокируют запуск: если Google Fonts недоступен (РФ без VPN), берётся системный шрифт -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="./styles.css">
  <!-- Библиотеки лежат на нашем сайте (vendor/), не на CDN: jsDelivr у части провайдеров РФ заблокирован -> белый экран.
       Обновление: npm i, затем пересобрать vendor/ (см. vendor/README.md). -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "./vendor/supabase-js.js",
      "tesseract.js": "./vendor/tesseract.js"
    }
  }
  </script>
</head>
<body>
  <div id="app" class="app" data-loading>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>
  <div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>
  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="./src/ui/main.js"></script>
</body>
</html>
